name: Compilation et publication

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Vérification des trames
        run: |
          pip install pyyaml --quiet
          python3 docs/verifier_trames.py
          python3 tools/export_trames.py

      - name: Compilation (debug)
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Compilation (release signée)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COPILOTECI_KEYSTORE_B64: ${{ secrets.COPILOTECI_KEYSTORE_B64 }}
          COPILOTECI_KEYSTORE_PASSWORD: ${{ secrets.COPILOTECI_KEYSTORE_PASSWORD }}
          COPILOTECI_KEY_ALIAS: ${{ secrets.COPILOTECI_KEY_ALIAS }}
          COPILOTECI_KEY_PASSWORD: ${{ secrets.COPILOTECI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
